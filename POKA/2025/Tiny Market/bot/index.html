<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bot Visit Service</title>
    <style>
      :root {
        --bg: #0f1115;
        --panel: #151922;
        --text: #e6e8ee;
        --muted: #9aa3b2;
        --link: #7aa2ff;
        --accent: #69db7c;
        --danger: #ff6b6b;
        --border: #232a36;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
        margin: 0;
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto,
          Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji";
        background: var(--bg);
        color: var(--text);
      }

      .container {
        max-width: 600px;
        margin: 0 auto;
        padding: 0 16px;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
      }

      .header {
        text-align: center;
        margin-bottom: 32px;
      }

      .logo {
        width: 48px;
        height: 48px;
        margin: 0 auto 16px;
        background: var(--accent);
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 24px;
        font-weight: bold;
        color: var(--bg);
      }

      .title {
        font-size: 32px;
        font-weight: 700;
        margin: 0 0 8px;
        background: linear-gradient(135deg, var(--text), var(--muted));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }

      .subtitle {
        font-size: 16px;
        color: var(--muted);
        margin: 0;
      }

      .card {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 32px;
        width: 100%;
        max-width: 480px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
      }

      .form-group {
        margin-bottom: 20px;
      }

      label {
        display: block;
        margin-bottom: 8px;
        color: var(--text);
        font-weight: 500;
        font-size: 14px;
      }

      input[type="text"] {
        width: 100%;
        background: #0c0f14;
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 14px 16px;
        font-size: 16px;
        transition: all 0.2s ease;
      }

      input[type="text"]:focus {
        outline: none;
        border-color: var(--link);
        box-shadow: 0 0 0 3px rgba(122, 162, 255, 0.1);
      }

      .submit-btn {
        width: 100%;
        background: var(--link);
        color: #0b0d12;
        border: none;
        padding: 14px 20px;
        border-radius: 10px;
        font-weight: 600;
        font-size: 16px;
        cursor: pointer;
        transition: all 0.2s ease;
        margin-top: 8px;
      }

      .submit-btn:hover {
        background: #6b96ff;
        transform: translateY(-1px);
        box-shadow: 0 4px 12px rgba(122, 162, 255, 0.3);
      }

      .submit-btn:active {
        transform: translateY(0);
      }

      .submit-btn:disabled {
        opacity: 0.6;
        cursor: not-allowed;
        transform: none;
        box-shadow: none;
      }

      .status-message {
        margin-top: 16px;
        padding: 12px 16px;
        border-radius: 8px;
        font-size: 14px;
        text-align: center;
        opacity: 0;
        transition: all 0.3s ease;
      }

      .status-message.success {
        background: rgba(105, 219, 124, 0.1);
        color: var(--accent);
        border: 1px solid rgba(105, 219, 124, 0.3);
        opacity: 1;
      }

      .status-message.error {
        background: rgba(255, 107, 107, 0.1);
        color: var(--danger);
        border: 1px solid rgba(255, 107, 107, 0.3);
        opacity: 1;
      }

      .footer {
        margin-top: 32px;
        text-align: center;
        color: var(--muted);
        font-size: 14px;
      }

      .footer a {
        color: var(--link);
        text-decoration: none;
      }

      .footer a:hover {
        text-decoration: underline;
      }

      @media (max-width: 640px) {
        .container {
          padding: 16px;
        }

        .card {
          padding: 24px;
        }

        .title {
          font-size: 28px;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <div class="logo">🤖</div>
        <h1 class="title">Tiny Market Bot Product Visit Service</h1>
        <p class="subtitle">
          주문하신 상품을 빠르게 배송받고 싶으신가요?<br />자동화 봇이 구매한
          상품을 빠르게 처리합니다!
        </p>
      </div>

      <div class="card">
        <form id="visit-form">
          <div class="form-group">
            <label for="url-input">주문하신 상품의 URL을 입력해주세요.</label>
            <input
              type="text"
              id="url-input"
              name="url"
              placeholder="/products/prd_00000/orders/ord_00000"
              required
            />
          </div>

          <div class="form-group">
            <label for="close-after-ms-input">방문 후 대기 시간 (옵션)</label>
            <input
              type="text"
              value="2000"
              id="close-after-ms-input"
              name="closeAfterMs"
              placeholder="2000"
            />
          </div>

          <button type="submit" class="submit-btn" id="submit-btn">
            상품 배송 처리하기
          </button>

          <div id="status-message" class="status-message"></div>
        </form>
      </div>

      <div class="footer">
        <p>Powered by <a href="#">Tiny Market</a> Bot Service</p>
      </div>
    </div>

    <script>
      const form = document.getElementById("visit-form");
      const urlInput = document.getElementById("url-input");
      const closeAfterMsInput = document.getElementById("close-after-ms-input");
      const submitBtn = document.getElementById("submit-btn");
      const statusMessage = document.getElementById("status-message");

      function showMessage(message, type) {
        statusMessage.textContent = message;
        statusMessage.className = `status-message ${type}`;

        setTimeout(() => {
          statusMessage.className = "status-message";
        }, 5000);
      }

      form.addEventListener("submit", async (e) => {
        e.preventDefault();

        const url = urlInput.value.trim();
        const closeAfterMs = closeAfterMsInput.value.trim();

        if (!url) {
          showMessage("URL을 입력해주세요.", "error");
          return;
        }

        submitBtn.disabled = true;
        submitBtn.textContent = "방문 중...";

        try {
          const response = await fetch(`/visit`, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({ url: url, closeAfterMs: closeAfterMs }),
          });

          const result = await response.json();

          if (response.ok) {
            showMessage("성공적으로 처리했습니다!", "success");
            urlInput.value = "";
          } else {
            showMessage(`오류: ${result.error}`, "error");
          }
        } catch (error) {
          showMessage("네트워크 오류가 발생했습니다.", "error");
        } finally {
          submitBtn.disabled = false;
          submitBtn.textContent = "상품 배송 처리하기";
        }
      });

      urlInput.addEventListener("input", (e) => {
        const value = e.target.value.trim();
        if (
          value &&
          !value.startsWith("http://") &&
          !value.startsWith("https://")
        ) {
          // do not anything
        }
      });
    </script>
  </body>
</html>
