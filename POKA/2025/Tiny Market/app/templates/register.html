{% extends 'base.html' %} {% block title %}Register - Tiny Market{% endblock %}
{% block content %}
<section class="card">
  <h1>회원가입</h1>
  <p class="muted">
    Tiny Market에 오신 것을 환영합니다. 이미 회원이신가요?
    <a class="muted" href="/login">로그인</a>
  </p>
  <form id="register-form" class="space-y-3">
    <div>
      <label for="email">이메일</label>
      <input
        id="email"
        name="email"
        type="email"
        required
        placeholder="you@example.com"
      />
    </div>
    <div>
      <label for="name">이름</label>
      <input id="name" name="name" type="text" required placeholder="홍길동" />
    </div>
    <div>
      <label for="password">비밀번호</label>
      <input id="password" name="password" type="password" required />
    </div>
    <div>
      <label for="re-password">비밀번호 확인</label>
      <input id="re-password" name="re-password" type="password" required />
    </div>
    <div class="row">
      <button id="register-btn" type="submit">회원가입하기</button>
      <span id="status" class="muted"></span>
    </div>
  </form>
</section>
{% endblock %} {% block scripts %}
<script
  nonce="{{ g.csp_nonce }}"
  src="{{ url_for('static', filename='scripts/page-register.js') }}"
  defer
></script>
{% endblock %}
