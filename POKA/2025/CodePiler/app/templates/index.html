<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodePiler - Online IDE</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .navbar-brand {
            font-weight: 700;
        }
        #editor {
            font-family: 'Fira Code', monospace;
            min-height: 400px;
            background-color: #212529;
            color: #f8f9fa;
            border: 1px solid #495057;
        }
        #output {
            min-height: 150px;
            background-color: #212529;
            color: #adb5bd;
            font-family: 'Fira Code', monospace;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg bg-body-tertiary border-bottom">
        <div class="container">
            <a class="navbar-brand" href="#">CodePiler</a>
            <div class="d-flex" id="auth-section">
            </div>
        </div>
    </nav>

    <main class="container mt-4">
        <div class="row">
            <div class="col-lg-8">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <div class="d-flex align-items-center gap-3">
                        <select id="language" class="form-select form-select-sm w-auto">
                            <option value="c">C</option>
                            <option value="python">Python</option>
                            <option value="markdown">Markdown (Admin)</option>
                        </select>
                    </div>
                    <button id="compile-btn" class="btn btn-primary">Compile</button>
                </div>
                <textarea id="editor" class="form-control" spellcheck="false">#include <stdio.h>

int main() {
    printf("Hello, World!");
    return 0;
}</textarea>
            </div>

            <div class="col-lg-4">
                <h5 class="mt-3 mt-lg-0">Status</h5>
                <div id="status-message" class="alert alert-secondary">Ready</div>
                
                <h5>Output</h5>
                <div id="output" class="p-3 rounded"></div>
            </div>
        </div>
    </main>

    <div class="modal fade" id="loginModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Login</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="login-form">
                        <div class="mb-3"><input type="text" id="login-username" class="form-control" placeholder="Username" required></div>
                        <div class="mb-3"><input type="password" id="login-password" class="form-control" placeholder="Password" required></div>
                        <button type="submit" class="btn btn-primary w-100">Login</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
    <div class="modal fade" id="registerModal" tabindex="-1">
         <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Register</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="register-form">
                        <div class="mb-3"><input type="text" id="register-username" class="form-control" placeholder="Username" required></div>
                        <div class="mb-3"><input type="password" id="register-password" class="form-control" placeholder="Password" required></div>
                        <button type="submit" class="btn btn-success w-100">Create Account</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // This is server side challenge. index.html is not useful. :)
    </script>
</body>
</html>
