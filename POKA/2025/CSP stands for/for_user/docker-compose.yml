services:
  db:
    image: mysql:8.0
    container_name: web-csp_stands_db
    restart: always
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: prob_csp
      MYSQL_USER: poka
      MYSQL_PASSWORD: poka
      MYSQL_ROOT_PASSWORD: rootpass
    volumes:
      - db_data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
      interval: 5s
      timeout: 3s
      retries: 20

  web-csp_stands_for:
    container_name: web-csp_stands_for
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: poka
      DB_PASSWORD: poka
      DB_NAME: prob_csp
      PORT: 7575
    ports:
      - "7575:7575"

volumes:
  db_data:
  